[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-compaction-guardian"
version = "0.1.0"
description = "Offline Iceberg-style compaction and data-quality guardian for a cloud lakehouse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ayush Gawai" }]
dependencies = ["pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
